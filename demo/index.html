<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>handy-ds demo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;700&display=swap" />
    <style>
      /* Demo layout only. Not part of the library. */
      .hero { padding: 3rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(22rem, 1fr)); gap: 1.5rem; padding: 2rem; }
      .grid > * { display: flex; flex-direction: column; gap: 1rem; align-items: flex-start; }
      .grid > * > :is(.hds-form, .hds-accordion, .hds-tabs, .hds-table, .hds-alert, .hds-meter, .hds-field, .hds-separator) { align-self: stretch; }
      .wide { grid-column: 1 / -1; }
      .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
      .nested { max-width: 32rem; }
      .controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; align-items: center; border-radius: 0; padding: 0.75rem 2rem; }
      .controls label { display: inline-flex; gap: 0.4rem; align-items: center; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
